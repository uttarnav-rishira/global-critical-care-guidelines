name: Import licensed open-access guideline PDFs

on:
  workflow_dispatch:
    inputs:
      allow_noncommercial:
        description: "Allow unchanged CC BY-NC / CC BY-NC-ND PDFs for non-commercial redistribution"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: write

jobs:
  import-pdfs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/priority-domain-verification-01
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation libraries
        run: python -m pip install requests pypdf
      - name: Retrieve exact PMC publisher PDFs and check licence and credit text
        run: |
          ARGS=""
          if [ "${{ inputs.allow_noncommercial }}" = "yes" ]; then ARGS="--allow-noncommercial"; fi
          python scripts/import_open_access_pdfs.py $ARGS
      - name: Commit PDFs and manifest
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/open-access/
          if git diff --cached --quiet; then
            echo "No newly approved PDFs to commit."
          else
            git commit -m "Add rights-cleared open-access guideline PDFs"
            git push origin HEAD:research/priority-domain-verification-01
          fi
